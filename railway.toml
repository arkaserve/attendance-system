# Railway — AttendanceSystem backend (Express + node:sqlite, persistent volume)
# Deploy:  push this repo to GitHub → Railway → New Project → Deploy from repo → select this repo
# Then attach a Volume (see below) and set the service's root directory.

[build]
# Nixpacks auto-detect will pick Node from backend/package.json once we set the root.
# Recommended instead: Dockerfile (already in repo) for a reproducible build.
#   In Railway: Service → Settings → Build → "Dockerfile"

[deploy]
# Railway injects PORT automatically; server.js already uses process.env.PORT || 5000
healthcheckPath = "/api/stats"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
