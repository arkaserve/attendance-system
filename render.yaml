services:
  - type: web
    name: attendance-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ../Dockerfile
    dockerContext: ..
    envVars:
      - key: PORT
        value: 5000
      - key: DB_PATH
        value: /data/attendance.db
    disk:
      name: attendance-data
      mountPath: /data
      sizeGB: 1
